<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D Inventory Manager</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dndred: { 600: '#7f1d1d', 700: '#991b1b', 800: '#7f1d1d', 900: '#450a0a' },
                        dnddark: { 800: '#1e1e24', 900: '#121216', 950: '#0a0a0c' }
                    }
                }
            }
        }
    </script>
    <!-- Firebase SDKs e Lógica Principal -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, doc, getDoc, setDoc, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // SUA CONFIGURAÇÃO DO FIREBASE JÁ INSERIDA
        const firebaseConfig = {
            apiKey: "AIzaSyAKITOB2KfQjeWdM-eKU1H36OmbRCufqPY",
            authDomain: "testeded-20788.firebaseapp.com",
            projectId: "testeded-20788",
            storageBucket: "testeded-20788.firebasestorage.app",
            messagingSenderId: "612661245699",
            appId: "1:612661245699:web:2cb860ba1bc64f61699b36",
            measurementId: "G-1G3BYEB1L8"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUserRole = null;
        let currentUserId = null;
        let currentUserEmail = null;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                await loadUserData(user);
            } else {
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('app-screen').classList.add('hidden');
            }
        });

        window.handleAuth = async function(event) {
            event.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const isRegister = document.getElementById('is-register').checked;
            const errorDiv = document.getElementById('auth-error');
            errorDiv.classList.add('hidden');

            try {
                if (isRegister) {
                    await createUserWithEmailAndPassword(auth, email, password);
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
            } catch (error) {
                errorDiv.innerText = error.message;
                errorDiv.classList.remove('hidden');
            }
        }

        window.logout = function() {
            signOut(auth);
        }

        async function loadUserData(user) {
            currentUserId = user.uid;
            currentUserEmail = user.email;
            
            const userDocRef = doc(db, "usuarios", currentUserId);
            let userSnap = await getDoc(userDocRef);

            if (!userSnap.exists()) {
                currentUserRole = 'jogador';
                await setDoc(userDocRef, { email: currentUserEmail, papel: currentUserRole });
            } else {
                currentUserRole = userSnap.data().papel;
            }

            document.getElementById('user-role-badge').innerText = `Perfil: ${currentUserRole}`;
            renderDashboard();
        }

        async function renderDashboard() {
            const container = document.getElementById('main-content');
            container.innerHTML = '<p class="text-center text-gray-400">A carregar painel...</p>';

            if (currentUserRole === 'admin') {
                container.innerHTML = `
                    <h3 class="text-2xl font-bold mb-4">Painel do Administrador</h3>
                    <div class="bg-dnddark-900 p-6 rounded-lg border border-gray-800 mb-6">
                        <h4 class="text-lg font-semibold mb-3">Cadastrar Novo Mestre (DM)</h4>
                        <p class="text-sm text-gray-400 mb-2">Para tornar um utilizador Mestre, crie a conta dele primeiro e depois atualize o documento correspondente na coleção 'usuarios' no painel do Firebase alterando o campo 'papel' para 'mestre'.</p>
                    </div>
                `;
            } else if (currentUserRole === 'mestre') {
                const campSnap = await getDocs(query(collection(db, "campanhas"), where("mestreId", "==", currentUserId)));
                let campanhasHTML = '';
                campSnap.forEach(docSnap => {
                    const c = docSnap.data();
                    campanhasHTML += `<div class="bg-dnddark-900 p-4 rounded border border-gray-800 mb-2 flex justify-between items-center">
                        <span><strong>${c.nome}</strong></span>
                    </div>`;
                });

                container.innerHTML = `
                    <h3 class="text-2xl font-bold mb-4">Painel do Mestre (DM)</h3>
                    <div class="bg-dnddark-900 p-6 rounded-lg border border-gray-800 mb-6">
                        <h4 class="text-lg font-semibold mb-3">Criar Nova Campanha</h4>
                        <div class="flex gap-4">
                            <input type="text" id="campanha-nome" placeholder="Nome da Campanha (ex: Maldição de Strahd)" class="flex-1 bg-dnddark-950 border border-gray-700 rounded p-2">
                            <button onclick="window.criarCampanha()" class="bg-dndred-700 hover:bg-dndred-800 px-4 py-2 rounded font-bold">Criar</button>
                        </div>
                    </div>
                    <h4 class="text-xl font-semibold mb-3">As Suas Campanhas</h4>
                    <div>${campanhasHTML || '<p class="text-gray-400">Nenhuma campanha cadastrada.</p>'}</div>
                `;
            } else {
                const charSnap = await getDocs(query(collection(db, "personagens"), where("jogadorId", "==", currentUserId)));
                let charsHTML = '';
                
                for(let docSnap of charSnap.docs) {
                    const p = docSnap.data();
                    charsHTML += `
                        <div class="bg-dnddark-900 p-6 rounded-lg border border-gray-800 mb-4">
                            <h4 class="text-xl font-bold text-red-400">${p.nomePersonagem} (${p.classe})</h4>
                            <p class="text-sm text-gray-400 mb-4">Dinheiro - Ouro: ${p.ouro || 0} | Prata: ${p.prata || 0} | Cobre: ${p.cobre || 0}</p>
                            <h5 class="font-semibold mb-2">Inventário</h5>
                            <div id="inv-${docSnap.id}" class="space-y-2 mb-4">A carregar itens...</div>
                            <div class="flex gap-2">
                                <input type="text" id="item-nome-${docSnap.id}" placeholder="Nome do Item" class="bg-dnddark-950 border border-gray-700 rounded p-1 text-sm flex-1">
                                <input type="number" id="item-qtd-${docSnap.id}" placeholder="Qtd" value="1" class="w-16 bg-dnddark-950 border border-gray-700 rounded p-1 text-sm">
                                <button onclick="window.adicionarItem('${docSnap.id}')" class="bg-green-700 hover:bg-green-800 px-3 py-1 rounded text-sm font-bold">Adicionar Item</button>
                            </div>
                        </div>`;
                }

                container.innerHTML = `
                    <h3 class="text-2xl font-bold mb-4">Os Seus Personagens</h3>
                    <div>${charsHTML || '<p class="text-gray-400">Ainda não tem personagens vinculados. Peça ao Mestre para cadastrar o seu personagem e e-mail.</p>'}</div>
                `;

                charSnap.forEach(async (docSnap) => {
                    const itensSnap = await getDocs(collection(db, "personagens", docSnap.id, "itens"));
                    let itensHTML = '<ul class="list-disc list-inside text-sm text-gray-300">';
                    if(itensSnap.empty) itensHTML = '<p class="text-sm text-gray-500">Inventário vazio.</p>';
                    itensSnap.forEach(itemDoc => {
                        const i = itemDoc.data();
                        itensHTML += `<li>${i.nome} (Qtd: ${i.quantidade})</li>`;
                    });
                    if(!itensSnap.empty) itensHTML += '</ul>';
                    const el = document.getElementById(`inv-${docSnap.id}`);
                    if(el) el.innerHTML = itensHTML;
                });
            }
        }

        window.criarCampanha = async function() {
            const nome = document.getElementById('campanha-nome').value;
            if(!nome) return;
            await addDoc(collection(db, "campanhas"), {
                nome: nome,
                mestreId: currentUserId
            });
            renderDashboard();
        }

        window.adicionarItem = async function(personagemId) {
            const nome = document.getElementById(`item-nome-${personagemId}`).value;
            const quantidade = parseInt(document.getElementById(`item-qtd-${personagemId}`).value) || 1;
            if(!nome) return;
            await addDoc(collection(db, "personagens", personagemId, "itens"), {
                nome, quantidade
            });
            renderDashboard();
        }
    </script>
</head>
<body class="bg-dnddark-950 text-gray-100 font-sans min-h-screen flex flex-col">

    <!-- TELA DE AUTENTICAÇÃO -->
    <div id="auth-screen" class="flex-1 flex items-center justify-center p-4">
        <div class="bg-dnddark-900 border border-dndred-800 p-8 rounded-xl shadow-2xl w-full max-w-md">
            <h1 class="text-3xl font-bold text-center text-red-500 mb-6">D&D Inventory Manager</h1>
            <div id="auth-error" class="bg-red-900/50 border border-red-700 text-red-200 p-3 rounded mb-4 hidden text-sm"></div>
            <form id="auth-form" onsubmit="window.handleAuth(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">E-mail</label>
                    <input type="email" id="auth-email" required class="w-full bg-dnddark-950 border border-gray-700 rounded p-2 focus:border-red-600 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Senha</label>
                    <input type="password" id="auth-password" required class="w-full bg-dnddark-950 border border-gray-700 rounded p-2 focus:border-red-600 focus:outline-none">
                </div>
                <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center"><input type="checkbox" id="is-register" class="mr-2"> Criar nova conta</label>
                </div>
                <button type="submit" class="w-full bg-dndred-700 hover:bg-dndred-800 text-white font-bold py-2 rounded transition">Entrar / Registar</button>
            </form>
        </div>
    </div>

    <!-- TELA PRINCIPAL DO APLICATIVO -->
    <div id="app-screen" class="hidden flex-1 flex flex-col">
        <header class="bg-dnddark-900 border-b border-gray-800 p-4 flex justify-between items-center">
            <h2 class="text-xl font-bold text-red-500">🎲 D&D Mesa Manager</h2>
            <div class="flex items-center space-x-4">
                <span id="user-role-badge" class="px-3 py-1 bg-dndred-900 text-xs font-semibold rounded-full uppercase"></span>
                <button onclick="window.logout()" class="text-sm bg-gray-800 hover:bg-gray-700 px-3 py-1.5 rounded transition">Sair</button>
            </div>
        </header>

        <main class="flex-1 p-6 max-w-6xl w-full mx-auto" id="main-content">
        </main>
    </div>

</body>
</html>
